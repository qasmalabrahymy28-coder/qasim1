<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>برنامج إدارة رصد درجات الطلاب</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        #subjectTable { table-layout: fixed; width: 100%; }
        #subjectTable .col-check { width: 36px; }
        #subjectTable .col-seq { width: 38px; }
        #subjectTable .col-name { width: 210px; }
        #subjectTable .col-grade { width: 58px; }
        #subjectTable .col-del { width: 42px; }

        @media print {
            body { background: white; margin: 0; padding: 0; }
            .no-print { display: none !important; }
            @page { size: A4 portrait; margin: 4mm !important; }
            table { font-size: 11px !important; border-collapse: collapse !important; width: 100% !important; }
            #subjectTable .col-seq { width: 4.5% !important; }
            #subjectTable .col-name { width: 23.5% !important; text-align: right !important; }
            #subjectTable .col-grade { width: 6% !important; }
            tr { break-inside: avoid !important; }
            thead { display: table-header-group !important; }
            tfoot { display: table-footer-group !important; }
            th, td { border: 1.5px solid #000 !important; padding: 2.5px 1px !important; text-align: center !important; }
            th { background-color: #e2e8f0 !important; color: #000 !important; font-weight: bold !important; font-size: 10px !important; }
            .student-name-input { display: none !important; }
            .print-student-name { display: inline-block !important; font-weight: bold !important; font-size: 11px !important; color: #000 !important; }
            input, textarea { border: none !important; background: transparent !important; text-align: center !important; font-size: 11.5px !important; font-weight: bold !important; width: 100% !important; }
        }
        .print-student-name { display: none; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen p-4">

    <div class="max-w-7xl mx-auto">
        <!-- الرأس -->
        <header class="bg-indigo-900 text-white rounded-2xl p-4 mb-6 shadow-md flex flex-wrap justify-between items-center gap-4 no-print">
            <div>
                <h1 class="text-xl font-bold">برنامج رصد ونتائج الطلاب</h1>
                <p class="text-indigo-200 text-xs mt-1">إعداد: قاسم ناظم موسى</p>
            </div>
            <div class="flex items-center gap-3">
                <div class="bg-indigo-800 px-3 py-1.5 rounded-xl border border-indigo-700 flex items-center gap-2">
                    <label class="text-xs text-indigo-200 font-bold">العام:</label>
                    <input type="text" id="globalAcademicYear" value="٢٠٢٦ - ٢٠٢٧" onchange="loadSubjectData()" class="bg-indigo-950 text-white text-xs font-bold px-2 py-1 rounded text-center w-28 outline-none">
                </div>
                <div class="flex gap-2">
                    <button onclick="switchTab('entry')" id="btn-entry" class="bg-indigo-700 px-4 py-2 rounded-xl text-xs font-medium transition">إدخال الدرجات</button>
                    <button onclick="switchTab('report')" id="btn-report" class="bg-indigo-800 px-4 py-2 rounded-xl text-xs font-medium transition opacity-70">النتيجة الشاملة</button>
                </div>
            </div>
        </header>

        <!-- قسم الإدخال -->
        <section id="tab-entry" class="space-y-6">
            <div class="bg-white rounded-2xl p-4 shadow-sm no-print flex flex-wrap gap-4 items-center justify-between">
                <div class="flex flex-wrap gap-4 items-center">
                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1">المادة الدراسية:</label>
                        <select id="subjectSelect" onchange="loadSubjectData()" class="border rounded-xl px-3 py-2 bg-slate-50 text-sm font-medium outline-none">
                            <option value="التربية الإسلامية">التربية الإسلامية</option>
                            <option value="اللغة العربية">اللغة العربية</option>
                            <option value="العلوم والتربية الصحية" selected>العلوم والتربية الصحية</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1">الصف والشعبة:</label>
                        <select id="classSectionSelect" onchange="loadSubjectData()" class="border rounded-xl px-3 py-2 bg-slate-50 text-sm font-medium outline-none">
                            <option value="الخامس الابتدائي - أ">الخامس الابتدائي - أ</option>
                            <option value="الخامس الابتدائي - ب" selected>الخامس الابتدائي - ب</option>
                        </select>
                    </div>
                </div>
                <div class="flex gap-2 flex-wrap items-center">
                    <button onclick="window.print()" class="bg-emerald-600 text-white px-3 py-2 rounded-xl text-sm font-medium shadow">🖨️ طباعة</button>
                    <button onclick="openImportModal()" class="bg-purple-600 text-white px-3 py-2 rounded-xl text-sm font-medium shadow">📥 استيراد بيانات</button>
                    <button onclick="addNewStudent()" class="bg-indigo-600 text-white px-3 py-2 rounded-xl text-sm font-medium shadow">➕ إضافة طالب</button>
                    <button onclick="deleteSelectedStudents()" class="bg-rose-600 text-white px-3 py-2 rounded-xl text-sm font-medium shadow">🗑️ حذف المحدد</button>
                </div>
            </div>

            <!-- الجدول -->
            <div class="bg-white rounded-2xl shadow-sm overflow-hidden border-2 border-slate-400">
                <div class="p-4 bg-indigo-50 border-b border-indigo-200">
                    <h3 id="currentSubjectTitle" class="font-bold text-indigo-900 text-sm">سجل درجات</h3>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-center border-collapse text-xs border border-slate-400" id="subjectTable">
                        <thead>
                            <tr class="bg-slate-200 border-b border-slate-400">
                                <th rowspan="2" class="p-2 no-print"><input type="checkbox" id="selectAllCheckbox" onchange="toggleSelectAll(this)"></th>
                                <th rowspan="2" class="p-2 border-r border-slate-400">ت</th>
                                <th rowspan="2" class="p-2 border-r border-slate-400 text-right">اسم الطالب</th>
                                <th colspan="4" class="p-1 border-r border-slate-400 bg-blue-100">النصف الأول</th>
                                <th rowspan="2" class="p-1 border-r border-slate-400 bg-amber-100">نصف السنة</th>
                                <th colspan="4" class="p-1 border-r border-slate-400 bg-emerald-100">النصف الثاني</th>
                                <th rowspan="2" class="p-1 border-r border-slate-400 bg-purple-100">المعدل السنوي</th>
                                <th rowspan="2" class="p-1 border-r border-slate-400 bg-rose-100">الامتحان النهائي</th>
                                <th rowspan="2" class="p-1 border-r border-slate-400 bg-indigo-100">الدرجة النهائية</th>
                                <th rowspan="2" class="p-2 no-print">حذف</th>
                            </tr>
                            <tr class="bg-slate-100 border-b border-slate-400">
                                <th class="p-1 border-r border-slate-400 bg-blue-50">ت ١</th>
                                <th class="p-1 border-r border-slate-400 bg-blue-50">ت ٢</th>
                                <th class="p-1 border-r border-slate-400 bg-blue-50">ك ١</th>
                                <th class="p-1 border-r border-slate-400 bg-blue-200">المعدل</th>
                                <th class="p-1 border-r border-slate-400 bg-emerald-50">آذار</th>
                                <th class="p-1 border-r border-slate-400 bg-emerald-50">نيسان</th>
                                <th class="p-1 border-r border-slate-400 bg-emerald-50">أيار</th>
                                <th class="p-1 border-r border-slate-400 bg-emerald-200">المعدل</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody"></tbody>
                        <tfoot id="tableFooter" class="bg-slate-100 font-bold border-t-2 border-slate-400 text-xs"></tfoot>
                    </table>
                </div>
            </div>
        </section>

        <!-- قسم التقارير -->
        <section id="tab-report" class="space-y-6 hidden">
            <div class="bg-white rounded-2xl p-6 shadow-sm no-print flex items-center justify-between">
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">اختر الطالب لعرض نتيجته:</label>
                    <select id="studentSelectReport" onchange="generateStudentReport()" class="border rounded-xl px-3 py-2 bg-slate-50 font-medium outline-none text-sm w-64"></select>
                </div>
                <button onclick="window.print()" class="bg-emerald-600 text-white px-6 py-2 rounded-xl font-medium text-sm">🖨️ طباعة النتيجة</button>
            </div>
            <div id="reportsContainer" class="space-y-4"></div>
        </section>
    </div>

    <!-- نافذة الاستيراد -->
    <div id="importModal" class="fixed inset-0 bg-black/50 hidden z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-lg w-full p-6 space-y-4 shadow-xl">
            <h3 class="font-bold text-lg text-indigo-900 border-b pb-3">استيراد وإضافة بيانات الطلاب</h3>
            <div>
                <label class="block font-bold text-slate-700 mb-1 text-sm">لصق أسماء الطلاب (كل طالب في سطر):</label>
                <textarea id="importTextarea" rows="6" class="w-full border rounded-xl p-3 bg-slate-50 text-sm outline-none font-medium"></textarea>
            </div>
            <div class="flex justify-end gap-2 pt-3 border-t">
                <button onclick="closeImportModal()" class="bg-slate-200 text-slate-800 px-4 py-2 rounded-xl text-sm font-medium">إلغاء</button>
                <button onclick="processImportData()" class="bg-indigo-600 text-white px-5 py-2 rounded-xl text-sm font-medium">إدراج الطلاب</button>
            </div>
        </div>
    </div>

    <script>
        const subjects = ['التربية الإسلامية', 'اللغة العربية', 'العلوم والتربية الصحية'];
        const classesList = ['الخامس الابتدائي - أ', 'الخامس الابتدائي - ب'];

        let defaultStudentsClassB = [
            "تبارك حسين علي", "تقى باسم محمد", "جنات حيدر جاسم", "حيدر علاء حسين",
            "رضا كرار كاظم", "رقية ميثم عبد الواحد", "زينب عقيل مهدي", "سارة احمد عبد",
            "علي حسين جواد", "فاطمة حسن هادي", "محمد باقر قاسم", "مريم علاء كاظم",
            "مصطفى احمد جاسم", "نور الهدى علي حسين", "هدى حيدر عبود", "يوسف كرار صاحب"
        ];

        let classStudentsMap = {
            "الخامس الابتدائي - أ": ["طالب تجريبي 1", "طالب تجريبي 2"],
            "الخامس الابتدائي - b": [...defaultStudentsClassB],
            "الخامس الابتدائي - ب": [...defaultStudentsClassB]
        };

        let schoolDb = { grades: {} };

        function toArabicDigits(num) {
            if (num === undefined || num === null || isNaN(num) || num === '') return '٠';
            const arabicNumbers = ['٠', '١', '٢', '٣', '٤', '٥', '٦', '٧', '٨', '٩'];
            return String(num).replace(/\d/g, (digit) => arabicNumbers[digit]);
        }

        normalizeWesternDigits = function(str) {
            const arabicToWestern = {'٠':'0','١':'1','٢':'2','٣':'3','٤':'4','٥':'5','٦':'6','٧':'7','٨':'8','٩':'9'};
            return String(str || '').replace(/[٠-٩]/g, d => arabicToWestern[d]);
        }

        persistLocally = function() {
            try {
                const yr = document.getElementById('globalAcademicYear').value;
                const payload = { classStudentsMap, grades: schoolDb.grades };
                localStorage.setItem("qasim_db_" + normalizeWesternDigits(yr).replace(/\s+/g, ''), JSON.stringify(payload));
            } catch (err) {}
        }

        loadFromLocalStorage = function(academicYear) {
            try {
                const raw = localStorage.getItem("qasim_db_" + normalizeWesternDigits(academicYear).replace(/\s+/g, ''));
                if (!raw) return false;
                const data = JSON.parse(raw);
                if (data.classStudentsMap) classStudentsMap = data.classStudentsMap;
                if (data.grades) schoolDb.grades = data.grades;
                return true;
            } catch (err) { return false; }
        }

        window.switchTab = function(tab) {
            persistLocally();
            if(tab === 'entry') {
                document.getElementById('tab-entry').classList.remove('hidden');
                document.getElementById('tab-report').classList.add('hidden');
                document.getElementById('btn-entry').className = "bg-indigo-700 text-white px-4 py-2 rounded-xl text-xs font-medium transition";
                document.getElementById('btn-report').className = "bg-indigo-800 text-white px-4 py-2 rounded-xl text-xs font-medium transition opacity-70";
                loadSubjectData();
            } else {
                document.getElementById('tab-entry').classList.add('hidden');
                document.getElementById('tab-report').classList.remove('hidden');
                document.getElementById('btn-report').className = "bg-indigo-700 text-white px-4 py-2 rounded-xl text-xs font-medium transition";
                document.getElementById('btn-entry').className = "bg-indigo-800 text-white px-4 py-2 rounded-xl text-xs font-medium transition opacity-70";
                updateReportStudentsList();
            }
        }

        window.loadSubjectData = function() {
            const currentSub = document.getElementById('subjectSelect').value;
            const currentClass = document.getElementById('classSectionSelect').value;
            const academicYear = document.getElementById('globalAcademicYear').value;
            loadFromLocalStorage(academicYear);
            document.getElementById('currentSubjectTitle').innerText = `سجل درجات مادة: ${currentSub} (${currentClass})`;
            renderTable();
        }

        window.renderTable = function() {
            const currentSub = document.getElementById('subjectSelect').value;
            const currentClass = document.getElementById('classSectionSelect').value;
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            const studentsInClass = classStudentsMap[currentClass] || [];

            studentsInClass.forEach((student, index) => {
                if (!schoolDb.grades[currentSub]) schoolDb.grades[currentSub] = {};
                if (!schoolDb.grades[currentSub][student]) schoolDb.grades[currentSub][student] = [0,0,0,0,0,0,0,0];
                const g = schoolDb.grades[currentSub][student];
                
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="p-2 border-b border-r border-slate-400 no-print text-center"><input type="checkbox" class="student-checkbox w-4 h-4" value="${student}"></td>
                    <td class="p-2 border-b border-r border-slate-400 font-bold">${toArabicDigits(index + 1)}</td>
                    <td class="p-2 border-b border-r border-slate-400 text-right">
                        <span class="print-student-name">${student}</span>
                        <input type="text" value="${student}" onchange="updateStudentName('${currentClass}', ${index}, this.value)" class="student-name-input w-full bg-slate-50 border rounded px-2 font-bold text-sm outline-none focus:ring-2 focus:ring-indigo-500">
                    </td>
                    <td class="p-1 border-b border-r border-slate-400"><input type="number" value="${g[0]||''}" oninput="updateGrade('${currentSub}','${student}',0,this)" class="w-full text-center bg-slate-50 border font-black"></td>
                    <td class="p-1 border-b border-r border-slate-400"><input type="number" value="${g[1]||''}" oninput="updateGrade('${currentSub}','${student}',1,this)" class="w-full text-center bg-slate-50 border font-black"></td>
                    <td class="p-1 border-b border-r border-slate-400"><input type="number" value="${g[2]||''}" oninput="updateGrade('${currentSub}','${student}',2,this)" class="w-full text-center bg-slate-50 border font-black"></td>
                    <td class="p-1 border-b border-r border-slate-400 font-black text-blue-900 calc-m1">${toArabicDigits(Math.round((g[0]+g[1]+g[2])/3))}</td>
                    <td class="p-1 border-b border-r border-slate-400"><input type="number" value="${g[3]||''}" oninput="updateGrade('${currentSub}','${student}',3,this)" class="w-full text-center bg-amber-50 border font-black"></td>
                    <td class="p-1 border-b border-r border-slate-400"><input type="number" value="${g[4]||''}" oninput="updateGrade('${currentSub}','${student}',4,this)" class="w-full text-center bg-slate-50 border font-black"></td>
                    <td class="p-1 border-b border-r border-slate-400"><input type="number" value="${g[5]||''}" oninput="updateGrade('${currentSub}','${student}',5,this)" class="w-full text-center bg-slate-50 border font-black"></td>
                    <td class="p-1 border-b border-r border-slate-400"><input type="number" value="${g[6]||''}" oninput="updateGrade('${currentSub}','${student}',6,this)" class="w-full text-center bg-slate-50 border font-black"></td>
                    <td class="p-1 border-b border-r border-slate-400 font-black text-emerald-900 calc-m2">${toArabicDigits(Math.round((g[4]+g[5]+g[6])/3))}</td>
                    <td class="p-1 border-b border-r border-slate-400 font-black text-purple-900 calc-annual">${toArabicDigits(Math.round((Math.round((g[0]+g[1]+g[2])/3) + Math.round((g[4]+g[5]+g[6])/3) + g[3])/3))}</td>
                    <td class="p-1 border-b border-r border-slate-400"><input type="number" value="${g[7]||''}" oninput="updateGrade('${currentSub}','${student}',7,this)" class="w-full text-center bg-rose-50 border font-black"></td>
                    <td class="p-1 border-b border-r border-slate-400 font-black text-indigo-950 calc-final">${toArabicDigits(Math.round((Math.round((Math.round((g[0]+g[1]+g[2])/3) + Math.round((g[4]+g[5]+g[6])/3) + g[3])/3) + g[7])/2))}</td>
                    <td class="p-1 border-b no-print text-center"><button onclick="deleteStudent('${currentClass}','${student}')" class="text-red-500 font-bold hover:text-red-700">✕</button></td>
                `;
                tbody.appendChild(tr);
            });
            updateFooterStats(currentSub, currentClass);
        }

        window.updateGrade = function(subject, student, index, input) {
            let val = input.value === "" ? 0 : parseFloat(input.value);
            if(isNaN(val)) val = 0;
            if(!schoolDb.grades[subject]) schoolDb.grades[subject] = {};
            if(!schoolDb.grades[subject][student]) schoolDb.grades[subject][student] = [0,0,0,0,0,0,0,0];
            schoolDb.grades[subject][student][index] = val;
            renderTable();
            persistLocally();
        }

        window.updateStudentName = function(className, index, newName) {
            const oldName = classStudentsMap[className][index];
            const cleanName = newName.trim();
            if(!cleanName || cleanName === oldName) return;
            classStudentsMap[className][index] = cleanName;
            subjects.forEach(sub => {
                if(schoolDb.grades[sub] && schoolDb.grades[sub][oldName]) {
                    schoolDb.grades[sub][cleanName] = schoolDb.grades[sub][oldName];
                    delete schoolDb.grades[sub][oldName];
                }
            });
            persistLocally();
            renderTable();
        }

        window.addNewStudent = function() {
            const currentClass = document.getElementById('classSectionSelect').value;
            const name = prompt("أدخل اسم الطالب الجديد:");
            if (name && name.trim() !== "") {
                const cleanName = name.trim();
                if (!classStudentsMap[currentClass]) classStudentsMap[currentClass] = [];
                if (!classStudentsMap[currentClass].includes(cleanName)) {
                    classStudentsMap[currentClass].push(cleanName);
                    subjects.forEach(sub => {
                        if(!schoolDb.grades[sub]) schoolDb.grades[sub] = {};
                        if(!schoolDb.grades[sub][cleanName]) {
                            schoolDb.grades[sub][cleanName] = [0,0,0,0,0,0,0,0];
                        }
                    });
                }
                persistLocally();
                renderTable();
            }
        }

        window.deleteStudent = function(className, studentName) {
            if(confirm(`هل أنت متأكد من حذف الطالب ${studentName}؟`)) {
                classStudentsMap[className] = classStudentsMap[className].filter(s => s !== studentName);
                subjects.forEach(sub => {
                    if(schoolDb.grades[sub]) delete schoolDb.grades[sub][studentName];
                });
                persistLocally();
                renderTable();
            }
        }

        window.toggleSelectAll = function(selectAll) {
            document.querySelectorAll('.student-checkbox').forEach(cb => cb.checked = selectAll.checked);
        }

        window.deleteSelectedStudents = function() {
            const checkboxes = document.querySelectorAll('.student-checkbox:checked');
            if (checkboxes.length === 0) return alert("يرجى تحديد طلاب للحذف.");
            const currentClass = document.getElementById('classSectionSelect').value;
            if (confirm("حذف الطلاب المحددين؟")) {
                checkboxes.forEach(cb => {
                    const studentName = cb.value;
                    classStudentsMap[currentClass] = classStudentsMap[currentClass].filter(s => s !== studentName);
                    subjects.forEach(sub => { if(schoolDb.grades[sub]) delete schoolDb.grades[sub][studentName]; });
                });
                persistLocally();
                renderTable();
            }
        }

        window.openImportModal = function() {
            document.getElementById('importTextarea').value = '';
            document.getElementById('importModal').classList.remove('hidden');
        }

        window.closeImportModal = function() {
            document.getElementById('importModal').classList.add('hidden');
        }

        window.processImportData = function() {
            const currentClass = document.getElementById('classSectionSelect').value;
            const text = document.getElementById('importTextarea').value;
            if(!text.trim()) return alert("يرجى لصق الأسماء.");
            const lines = text.split('\n');
            let added = 0;
            lines.forEach(line => {
                let name = line.replace(/[\d.]+/g, '').trim();
                if(name && !classStudentsMap[currentClass].includes(name)) {
                    classStudentsMap[currentClass].push(name);
                    subjects.forEach(sub => {
                        if(!schoolDb.grades[sub]) schoolDb.grades[sub] = {};
                        if(!schoolDb.grades[sub][name]) schoolDb.grades[sub][name] = [0,0,0,0,0,0,0,0];
                    });
                    added++;
                }
            });
            persistLocally();
            closeImportModal();
            renderTable();
            alert(`تمت إضافة ${added} طالب.`);
        }

        window.updateFooterStats = function(currentSub, currentClass) {
            const tfoot = document.getElementById('tableFooter');
            const studentsInClass = classStudentsMap[currentClass] || [];
            if (studentsInClass.length === 0) { tfoot.innerHTML = ''; return; }
            let totalCount = studentsInClass.length;
            let columnStats = Array(12).fill().map(() => ({ passed: 0, failed: 0 }));

            studentsInClass.forEach(student => {
                const g = (schoolDb.grades[sub]) ? schoolDb.grades[sub][student] : [0,0,0,0,0,0,0,0];
                const m1 = Math.round((g[0] + g[1] + g[2]) / 3);
                const m2 = Math.round((g[4] + g[5] + g[6]) / 3);
                const annual = Math.round((m1 + m2 + g[3]) / 3);
                const finalGrade = Math.round((annual + g[7]) / 2);

                const columnValues = [g[0], g[1], g[2], m1, g[3], g[4], g[5], g[6], m2, annual, g[7], finalGrade];
                columnValues.forEach((val, colIndex) => {
                    if (val >= 50) columnStats[colIndex].passed++;
                    else columnStats[colIndex].failed++;
                });
            });

            let tfootHtml = '';
            const statLabels = [
                { title: 'العدد الكلي', key: 'total' }, { title: 'الناجحون', key: 'passed' },
                { title: 'الراسبون', key: 'failed' }, { title: 'نسبة النجاح', key: 'rate' }
            ];

            statLabels.forEach(label => {
                tfootHtml += `<tr class="border-t border-slate-400 font-bold text-center">`;
                tfootHtml += `<td class="p-1.5 no-print"></td><td colspan="2" class="p-1.5 text-right font-black">${label.title}</td>`;
                columnStats.forEach(stat => {
                    let val = '';
                    if (label.key === 'total') val = toArabicDigits(totalCount);
                    if (label.key === 'passed') val = toArabicDigits(stat.passed);
                    if (label.key === 'failed') val = toArabicDigits(stat.failed);
                    if (label.key === 'rate') val = toArabicDigits(totalCount > 0 ? Math.round((stat.passed / totalCount) * 100) : 0) + '٪';
                    tfootHtml += `<td class="p-1.5 border-r border-slate-400">${val}</td>`;
                });
                tfootHtml += `</tr>`;
            });
            tfoot.innerHTML = tfootHtml;
        }

        window.updateReportStudentsList = function() {
            const selectedClass = document.getElementById('classSectionSelect').value;
            const studentSelect = document.getElementById('studentSelectReport');
            studentSelect.innerHTML = '';
            (classStudentsMap[selectedClass] || []).forEach(student => {
                const opt = document.createElement('option');
                opt.value = student; opt.innerText = student;
                studentSelect.appendChild(opt);
            });
            generateStudentReport();
        }

        window.generateStudentReport = function() {
            const container = document.getElementById('reportsContainer');
            container.innerHTML = '';
            const student = document.getElementById('studentSelectReport').value;
            const currentClass = document.getElementById('classSectionSelect').value;
            if(!student) return;

            let tableRowsHtml = '';
            let totalSum = 0;

            subjects.forEach(sub => {
                const g = (schoolDb.grades[sub] && schoolDb.grades[sub][student]) ? schoolDb.grades[sub][student] : [0,0,0,0,0,0,0,0];
                const m1 = Math.round((g[0] + g[1] + g[2]) / 3);
                const m2 = Math.round((g[4] + g[5] + g[6]) / 3);
                const annual = Math.round((m1 + m2 + g[3]) / 3);
                const finalGrade = Math.round((annual + g[7]) / 2);
                totalSum += finalGrade;

                tableRowsHtml += `
                    <tr>
                        <td class="p-1 border border-slate-600 font-bold text-right">${sub}</td>
                        <td class="p-1 border border-slate-600">${toArabicDigits(g[0]||0)}</td>
                        <td class="p-1 border border-slate-600">${toArabicDigits(g[1]||0)}</td>
                        <td class="p-1 border border-slate-600">${toArabicDigits(g[2]||0)}</td>
                        <td class="p-1 border border-slate-600 font-bold text-blue-900">${toArabicDigits(m1)}</td>
                        <td class="p-1 border border-slate-600 bg-amber-50 font-bold">${toArabicDigits(g[3]||0)}</td>
                        <td class="p-1 border border-slate-600">${toArabicDigits(g[4]||0)}</td>
                        <td class="p-1 border border-slate-600">${toArabicDigits(g[5]||0)}</td>
                        <td class="p-1 border border-slate-600">${toArabicDigits(g[6]||0)}</td>
                        <td class="p-1 border border-slate-600 font-bold text-emerald-900">${toArabicDigits(m2)}</td>
                        <td class="p-1 border border-slate-600 font-bold text-purple-900">${toArabicDigits(annual)}</td>
                        <td class="p-1 border border-slate-600 bg-rose-50 font-bold">${toArabicDigits(g[7]||0)}</td>
                        <td class="p-1 border border-slate-600 bg-indigo-50 font-bold text-indigo-950">${toArabicDigits(finalGrade)}</td>
                    </tr>
                `;
            });

            const cardDiv = document.createElement('div');
            cardDiv.className = "bg-white rounded-xl p-4 border border-slate-400 space-y-4";
            cardDiv.innerHTML = `
                <div class="text-center border-b pb-2">
                    <h2 class="text-base font-bold">نتيجة الطالب: ${student} - الصف: ${currentClass}</h2>
                </div>
                <table class="w-full text-center border-collapse text-xs border border-slate-600">
                    <thead><tr class="bg-slate-200"><th>الدروس</th><th>ت١</th><th>ت٢</th><th>ك١</th><th>معدل1</th><th>نصف السنة</th><th>آذار</th><th>نيسان</th><th>أيار</th><th>معدل2</th><th>المعدل السنوي</th><th>الامتحان النهائي</th><th>الدرجة النهائية</th></tr></thead>
                    <tbody>${tableRowsHtml}</tbody>
                </table>
                <div class="font-bold text-sm text-right">المجموع الكلي: ${toArabicDigits(totalSum)}</div>
            `;
            container.appendChild(cardDiv);
        }

        window.onload = function() { loadSubjectData(); }
    </script>
</body>
</html>
